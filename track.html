<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة حالة الصيانة - Galaxy Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col justify-center items-center">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-5">
        
        <div class="text-center space-y-1">
            <h1 class="text-xl font-black text-emerald-400">GALAXY CARE</h1>
            <p class="text-xs text-slate-400">بوابة متابعة حالة صيانة الأجهزة</p>
        </div>

        <!-- خانة البحث برقم الإذن أو الهاتف -->
        <div class="space-y-2">
            <label class="text-xs font-bold text-slate-300">أدخل رقم إذن الصيانة أو رقم الهاتف:</label>
            <div class="flex gap-2">
                <input type="text" id="trackInput" placeholder="مثال: 105 أو 010xxxxxxxx" 
                       class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-bold text-center">
                <button onclick="trackOrder()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs">
                    بحث 🔍
                </button>
            </div>
        </div>

        <!-- نتيجة البحث -->
        <div id="resultArea" class="hidden space-y-3 pt-2">
            <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-700/80 space-y-2 text-xs">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-slate-400 font-bold" id="resId">إذن رقم: #</span>
                    <span id="resStatus" class="px-2.5 py-1 rounded-lg font-black text-[11px]"></span>
                </div>
                <p><b>الجهاز:</b> <span id="resDevice" class="text-emerald-400 font-bold"></span></p>
                <p><b>العطل المسجل:</b> <span id="resProblem" class="text-slate-300"></span></p>
                <p id="resInspectionRow" class="text-slate-400"><b>تقرير الفحص:</b> <span id="resInspection"></span></p>
                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <div>
                        <span class="text-[10px] text-slate-400 block font-bold">التكلفة الإجمالية</span>
                        <span id="resCost" class="text-sm font-black text-emerald-400"></span>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block font-bold">فترة الضمان</span>
                        <span id="resWarranty" class="text-xs font-bold text-slate-200"></span>
                    </div>
                </div>
            </div>

            <a id="waBtn" href="#" target="_blank" class="block w-full text-center bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl text-xs font-bold transition">
                💬 استفسار عبر واتساب المركز
            </a>
        </div>

        <div id="errorMsg" class="hidden text-center text-xs text-rose-400 font-bold bg-rose-950/40 p-3 rounded-xl border border-rose-900">
            لم يتم العثور على أجهزة مطابقة لهذا الرقم.
        </div>

    </div>

    <script>
        const API_URL = "https://galaxycare-api.onrender.com/api";

        async function trackOrder() {
            const query = document.getElementById("trackInput").value.trim();
            const resultArea = document.getElementById("resultArea");
            const errorMsg = document.getElementById("errorMsg");

            resultArea.classList.add("hidden");
            errorMsg.classList.add("hidden");

            if (!query) return;

            try {
                const res = await fetch(`${API_URL}/track?q=${encodeURIComponent(query)}`);
                if (!res.ok) {
                    errorMsg.classList.remove("hidden");
                    return;
                }
                const data = await res.json();
                
                document.getElementById("resId").innerText = `إذن رقم: #${data.id}`;
                document.getElementById("resDevice").innerText = `${data.brand} ${data.model}`;
                document.getElementById("resProblem").innerText = data.problem_desc;
                document.getElementById("resCost").innerText = `${Number(data.cost || 0).toLocaleString()} ج.م`;
                document.getElementById("resWarranty").innerText = `${data.warranty_days || 14} يوم`;
                
                if (data.inspection) {
                    document.getElementById("resInspection").innerText = data.inspection;
                    document.getElementById("resInspectionRow").classList.remove("hidden");
                } else {
                    document.getElementById("resInspectionRow").classList.add("hidden");
                }

                const statusBadge = document.getElementById("resStatus");
                statusBadge.innerText = data.status;
                if (data.status === "تم التسليم") {
                    statusBadge.className = "px-2.5 py-1 rounded-lg font-black text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                } else if (data.status === "جاهز للتسليم") {
                    statusBadge.className = "px-2.5 py-1 rounded-lg font-black text-[11px] bg-blue-500/20 text-blue-400 border border-blue-500/30";
                } else {
                    statusBadge.className = "px-2.5 py-1 rounded-lg font-black text-[11px] bg-amber-500/20 text-amber-400 border border-amber-500/30";
                }

                document.getElementById("waBtn").href = `https://wa.me/201000000000?text=استفسار_بخصوص_إذن_صيانة_${data.id}`;
                resultArea.classList.remove("hidden");

            } catch (err) {
                errorMsg.classList.remove("hidden");
            }
        }

        // قراءة الباركود والبحث الفوري تلقائياً
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                document.getElementById('trackInput').value = q;
                trackOrder();
            }
        };
    </script>
</body>
</html>
